name: Package qualification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualify:
    name: Standalone package qualification (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
          - name: macos-arm64
            runner: macos-15
    steps:
      - name: Check out package
        uses: actions/checkout@v4

      - name: Check out Toka toolchain
        uses: actions/checkout@v4
        with:
          repository: tokalang/toka
          ref: main
          path: toka

      - name: Install LLVM 20 (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo -E apt-get update -o Acquire::Retries=5
          sudo apt-get install -y build-essential cmake ninja-build lsb-release software-properties-common
          wget --timeout=15 --tries=3 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo -E ./llvm.sh 20
          sudo apt-get install -y liblld-20-dev lld-20 libpolly-20-dev libzstd-dev libssl-dev

      - name: Install LLVM 20 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install llvm@20 lld@20 zstd openssl@3
          echo "$(brew --prefix llvm@20)/bin" >> "$GITHUB_PATH"
          echo "LLVM_DIR=$(brew --prefix llvm@20)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "LLD_DIR=$(brew --prefix lld@20)/lib/cmake/lld" >> "$GITHUB_ENV"
          echo "ZSTD_LIBRARY=$(brew --prefix zstd)/lib/libzstd.dylib" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Build Toka tools
        run: |
          set -euo pipefail
          cmake -S toka -B toka/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            ${LLVM_DIR:+-DLLVM_DIR="$LLVM_DIR"} \
            ${LLD_DIR:+-DLLD_DIR="$LLD_DIR"} \
            ${ZSTD_LIBRARY:+-DZSTD_LIBRARY="$ZSTD_LIBRARY"} \
            ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"}
          cmake --build toka/build --target toka-tools --parallel 2

      - name: Qualify standalone package
        env:
          TOKA_ROOT: ${{ github.workspace }}/toka
        run: python3 tests/qualify_package.py
